name: EdgeLab Acceptance

# Temporary CI-only acceptance workflow. The workflow commit (WORKFLOW_SHA)
# is deliberately separate from every source under test.

on:
  push:
    branches:
      - "ci/edgelab-py312-acceptance"

permissions:
  contents: read

env:
  WORKFLOW_SHA: ${{ github.sha }}

jobs:
  test:
    name: test (${{ matrix.source.label }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        source:
          - label: final-419f28b
            sha: 419f28b1410b96249183aae87745fe700fb6da13
            tree: c9ec486446c3215edb12bcc80442db5f7441fe41
    env:
      SOURCE_UNDER_TEST_SHA: ${{ matrix.source.sha }}
      EXPECTED_TREE_SHA: ${{ matrix.source.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source.sha }}
          fetch-depth: 0

      - name: Verify source identity
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          TREE_SHA=$(git rev-parse 'HEAD^{tree}')
          echo "SOURCE_UNDER_TEST_SHA=$SOURCE_UNDER_TEST_SHA HEAD=$HEAD_SHA"
          echo "EXPECTED_TREE_SHA=$EXPECTED_TREE_SHA TREE=$TREE_SHA"
          echo "WORKFLOW_SHA=$WORKFLOW_SHA"
          test "$HEAD_SHA" = "$SOURCE_UNDER_TEST_SHA" || { echo "::error::HEAD mismatch"; exit 1; }
          test "$TREE_SHA" = "$EXPECTED_TREE_SHA" || { echo "::error::tree mismatch"; exit 1; }
          test -z "$(git status --porcelain)" || { echo "::error::dirty checkout"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Capture environment
        if: always()
        run: |
          {
            echo "SOURCE_UNDER_TEST_SHA=$SOURCE_UNDER_TEST_SHA"
            echo "WORKFLOW_SHA=$WORKFLOW_SHA"
            echo "RUN_ID=${{ github.run_id }} ATTEMPT=${{ github.run_attempt }}"
            echo "### python --version"; python --version 2>&1
            echo "### python -VV"; python -VV 2>&1
            echo "### python -m pytest --version"; python -m pytest --version 2>&1
            echo "### python -m pip --version"; python -m pip --version 2>&1
            echo "### pwd"; pwd
            echo "### uname -a"; uname -a
            echo "### git rev-parse HEAD"; git rev-parse HEAD
            echo "### git rev-parse HEAD^{tree}"; git rev-parse 'HEAD^{tree}'
            echo "### git status --porcelain"; git status --porcelain
            echo "### git rev-parse --is-shallow-repository"; git rev-parse --is-shallow-repository
            echo "### python -m pip freeze"; python -m pip freeze 2>&1
          } > environment.txt 2>&1
          python -m pip freeze > pip-freeze.txt 2>&1
          cat environment.txt

      - name: Test (full regression)
        run: |
          set +e
          python -m pytest -q -rA --junitxml=pytest-results.xml > pytest-results.txt 2>&1
          PYTEST_EXIT=$?
          cat pytest-results.txt
          echo "PYTEST_EXIT_CODE=$PYTEST_EXIT" | tee -a pytest-results.txt
          exit $PYTEST_EXIT

      - name: Summarize counts
        if: always()
        run: |
          python - <<'PY' | tee -a pytest-results.txt >> "$GITHUB_STEP_SUMMARY"
          import os, re, xml.etree.ElementTree as ET
          print(f"SOURCE={os.environ['SOURCE_UNDER_TEST_SHA']} PYTHON={os.environ.get('pythonLocation','')}")
          if not os.path.exists("pytest-results.xml"):
              print("JUNIT_XML=MISSING"); raise SystemExit(0)
          root = ET.parse("pytest-results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          totals = {key: sum(int(suite.get(key, 0)) for suite in suites)
                    for key in ("tests", "failures", "errors", "skipped")}
          xfailed = sum(1 for testcase in root.iter("testcase")
                        if (skip := testcase.find("skipped")) is not None
                        and skip.get("type") == "pytest.xfail")
          text = open("pytest-results.txt", encoding="utf-8", errors="replace").read()
          xpassed = len(re.findall(r"^XPASS ", text, re.M))
          print(f"COLLECTED={totals['tests']}")
          print(f"PASSED={totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped'] - xpassed}")
          print(f"FAILED={totals['failures']}")
          print(f"ERRORS={totals['errors']}")
          print(f"SKIPPED={totals['skipped'] - xfailed}")
          print(f"XFAILED={xfailed}")
          print(f"XPASSED={xpassed}")
          for testcase in root.iter("testcase"):
              if testcase.find("failure") is not None or testcase.find("error") is not None:
                  print(f"FAILING_NODE={testcase.get('classname')}::{testcase.get('name')}")
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgelab-py${{ matrix.python-version == '3.12' && '312' || '313' }}-${{ matrix.source.label }}-diagnostics
          path: |
            pytest-results.txt
            pytest-results.xml
            environment.txt
            pip-freeze.txt
          if-no-files-found: warn
          retention-days: 90