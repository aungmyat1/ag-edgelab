name: EdgeLab Acceptance

# Temporary acceptance workflow. The workflow commit (WORKFLOW_SHA) is
# deliberately separate from the source under test (SOURCE_UNDER_TEST_SHA).

on:
  push:
    branches:
      - "ci/edgelab-py312-acceptance"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Source commit under test"
        required: true
        default: "129dd55751430959c11272c983521babdf5a6fae"
      source_tree:
        description: "Expected tree of the source commit (blank = skip tree check)"
        required: false
        default: "a9ce57342f2d800fc5a1929974ffd8133370de50"

permissions:
  contents: read

env:
  SOURCE_UNDER_TEST_SHA: ${{ inputs.source_sha || '129dd55751430959c11272c983521babdf5a6fae' }}
  EXPECTED_TREE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_tree || 'a9ce57342f2d800fc5a1929974ffd8133370de50' }}
  WORKFLOW_SHA: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Mandatory: a Python 3.13 failure must not cancel Python 3.12 diagnostics.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_UNDER_TEST_SHA }}
          fetch-depth: 0

      - name: Verify source identity
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          TREE_SHA=$(git rev-parse 'HEAD^{tree}')
          echo "SOURCE_UNDER_TEST_SHA=$SOURCE_UNDER_TEST_SHA"
          echo "WORKFLOW_SHA=$WORKFLOW_SHA"
          echo "HEAD=$HEAD_SHA"
          echo "TREE=$TREE_SHA"
          test "$HEAD_SHA" = "$SOURCE_UNDER_TEST_SHA" || { echo "::error::HEAD mismatch"; exit 1; }
          if [ -n "$EXPECTED_TREE_SHA" ]; then
            test "$TREE_SHA" = "$EXPECTED_TREE_SHA" || { echo "::error::tree mismatch"; exit 1; }
          fi
          test -z "$(git status --porcelain)" || { echo "::error::dirty checkout"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Capture environment
        if: always()
        run: |
          {
            echo "SOURCE_UNDER_TEST_SHA=$SOURCE_UNDER_TEST_SHA"
            echo "WORKFLOW_SHA=$WORKFLOW_SHA"
            echo "RUN_ID=${{ github.run_id }} ATTEMPT=${{ github.run_attempt }}"
            echo "### python --version";            python --version 2>&1
            echo "### python -VV";                  python -VV 2>&1
            echo "### python -m pip --version";     python -m pip --version 2>&1
            echo "### python -m pip freeze";        python -m pip freeze 2>&1
            echo "### uname -a";                    uname -a
            echo "### git rev-parse HEAD";          git rev-parse HEAD
            echo "### git rev-parse HEAD^{tree}";   git rev-parse 'HEAD^{tree}'
            echo "### git status --porcelain";      git status --porcelain
            echo "### git rev-parse --is-shallow-repository"; git rev-parse --is-shallow-repository
          } > environment.txt 2>&1
          python -m pip freeze > pip-freeze.txt 2>&1
          cat environment.txt

      # Informational only: reproduces the canonical ci.yml invocation (bare
      # `pytest`) that failed in run 37267680266. Never gates the job.
      - name: Reproduce canonical invocation (informational)
        if: always()
        continue-on-error: true
        run: |
          set +e
          pytest -p no:cacheprovider > pytest-canonical-repro.txt 2>&1
          REPRO_EXIT=$?
          tail -n 30 pytest-canonical-repro.txt
          echo "CANONICAL_PYTEST_EXIT_CODE=$REPRO_EXIT" | tee -a pytest-canonical-repro.txt

      - name: Test (full regression)
        run: |
          set +e
          PYTHONPATH=.:src python -m pytest \
              -ra \
              --tb=long \
              --junitxml=pytest-results.xml \
              > pytest-results.txt 2>&1
          PYTEST_EXIT=$?
          cat pytest-results.txt
          echo "PYTEST_EXIT_CODE=$PYTEST_EXIT" | tee -a pytest-results.txt
          exit $PYTEST_EXIT

      - name: Summarize JUnit counts
        if: always()
        run: |
          python - <<'PY' | tee -a pytest-results.txt >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          p = "pytest-results.xml"
          if not os.path.exists(p):
              print("JUNIT_XML=MISSING"); raise SystemExit(0)
          root = ET.parse(p).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tot = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "failures", "errors", "skipped")}
          xfailed = xpassed = 0
          for tc in root.iter("testcase"):
              sk = tc.find("skipped")
              if sk is not None and sk.get("type") == "pytest.xfail":
                  xfailed += 1
          print(f"PYTHON={os.environ.get('pythonLocation','')}")
          print(f"COLLECTED={tot['tests']}")
          print(f"PASSED={tot['tests'] - tot['failures'] - tot['errors'] - tot['skipped']}")
          print(f"FAILED={tot['failures']}")
          print(f"ERRORS={tot['errors']}")
          print(f"SKIPPED={tot['skipped'] - xfailed}")
          print(f"XFAILED={xfailed}")
          print("XPASSED=see -ra summary in pytest-results.txt")
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgelab-py${{ matrix.python-version == '3.12' && '312' || '313' }}-diagnostics
          path: |
            pytest-results.txt
            pytest-results.xml
            pytest-canonical-repro.txt
            environment.txt
            pip-freeze.txt
          if-no-files-found: warn
          retention-days: 90
