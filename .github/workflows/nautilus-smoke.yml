name: Nautilus smoke

on:
  push:
    branches:
      - "feat/r1-nautilus-adapter"
  pull_request:
    paths:
      - "src/ag_edgelab/engines/nautilus/**"
      - "pyproject.toml"
      - ".github/workflows/nautilus-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install EdgeLab with Nautilus backend
        run: python -m pip install -e ".[dev,nautilus]"
      - name: Verify current API imports
        run: |
          python - <<'PY'
          import nautilus_trader
          from nautilus_trader.backtest import BacktestEngine
          from nautilus_trader.config import BacktestEngineConfig
          print("nautilus_trader", nautilus_trader.__version__)
          engine = BacktestEngine(BacktestEngineConfig())
          print(type(engine).__name__)
          PY
      - name: Test
        run: pytest
