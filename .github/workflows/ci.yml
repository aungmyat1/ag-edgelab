name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # A failure on one Python version must not cancel the other.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        # `python -m pytest` puts the repository root on sys.path, which the
        # suite relies on for `tests.*` helper imports (tests/ is not a package).
        run: |
          set +e
          python -m pytest -q -rA --junitxml=pytest-results.xml > pytest-results.txt 2>&1
          PYTEST_EXIT=$?
          cat pytest-results.txt
          echo "PYTEST_EXIT_CODE=$PYTEST_EXIT"
          exit $PYTEST_EXIT
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: |
            pytest-results.txt
            pytest-results.xml
          if-no-files-found: warn
